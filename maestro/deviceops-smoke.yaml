appId: com.deviceops.technician
name: DeviceOps technician smoke
tags:
  - local
  - smoke
  - android

---
- launchApp:
    clearState: true
- assertVisible: "DeviceOps"
- tapOn: "Email"
- inputText: "tariq@deviceops.cloud"
- tapOn: "Password"
- inputText: "${DEVICEOPS_TEST_PASSWORD}"
- tapOn: "Sign in"
- assertVisible: "Devices"
- assertVisible: "Executive Boardroom Display"
- assertVisible: "DSP Processor"
- tapOn: "Executive Boardroom Display"
- assertVisible: "Agent Diagnostics"
- tapOn: "Queue diagnosis"
- assertVisible: "Durable run timeline"
- assertVisible: "AWAITING APPROVAL"
- assertVisible: "Citations"
